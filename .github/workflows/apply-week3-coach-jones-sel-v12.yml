name: Apply Week 3 Coach Jones SEL v12
on:
  push:
    branches: [main]
    paths:
      - 'week3-coach-jones-sel-v12.js'
      - '.github/workflows/apply-week3-coach-jones-sel-v12.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Week 3 Coach Jones script last
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./week3-coach-jones-sel-v12.js?v=20260918a"></script>'
          import re
          s=re.sub(r'\n?<script src="\./week3-coach-jones-sel-v12\.js[^\n]*</script>','',s)
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load Southeastern Coach Jones Week 3 tips"
          git push
