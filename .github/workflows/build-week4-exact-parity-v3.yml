name: Build Week 4 Exact Parity v3
on:
  push:
    branches:
      - week4-rebuild-clean
    paths:
      - .github/workflows/build-week4-exact-parity-v3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: week4-rebuild-clean
      - name: Generate Week 4 from Week 3 run renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('week3-run-chart-v3.js').read_text()
          s=s.replace('Week 3 Southeastern run-chart correction','Week 4 Florida Atlantic exact Week 3 run-chart parity')
          s=s.replace('const isW3=', 'const isW4=')
          s=s.replace("prepWeek==='W3'", "prepWeek==='W4'")
          s=s.replace('selectedW3Runs','selectedW4Runs')
          s=s.replace('if(!isW3())','if(!isW4())')
          old="function formationName(r){return String(r?.pff_OFFENSIVE_FORMATION_NAME||r?.pff_STARTING_OFFENSIVE_FORMATION_NAME||r?.pff_OFFFORMATIONGROUP||'').trim()}"
          new="const W4_FORM_MAP={'TREY - OPEN':'TREY Y OFF','SLOT - PRO':'DUO Y OFF','TRIPS - CLOSED':'TRIPS','TREY - CLOSED':'KING U OFF','TRIPS - OPEN':'TRIPS - OPEN','PRO - PRO':'ACE YU OFF','SLOT - SLOT':'DOUBLES','TRIPS - SLOT':'TRIPS - SLOT','SLOT - WING':'SLOT - WING','TOAD WING - OPEN':'TREY U HIP','PRO - OPEN':'PRO - OPEN','SLOT - CLOSED':'PRO','SLOT - OPEN':'SLOT - OPEN','QUAY - NIX':'TREY Y OFF','TREY - NIX':'TREY Y OFF','QUAY - OPEN':'TREY Y OFF','PRO - WING':'PRO - WING','QUADS WING - NIX':'QUADS WING - NIX','TREY - SLOT':'EMPTY 3x2 Y OFF','TREY - PRO':'ACE YU OFF','PRO - CLOSED':'KING U OFF B HIP','QUADS - OPEN':'EMPTY 4x1 Y OFF','TOAD WING - SLOT':'EMPTY 4x1 T STING','TOAD WING - PRO':'TOAD WING - PRO','TOAD WING - CLOSED':'TOAD WING - CLOSED','TRIPS - WING':'TRIPS - WING','TRIPS - PRO':'TRIPS - PRO','CLOSED - CLOSED':'CLOSED - CLOSED','OPEN - OPEN':'OPEN - OPEN','OPEN - CLOSED':'OPEN - CLOSED','WING - CLOSED':'WING - CLOSED','WING - OPEN':'WING - OPEN','WING - NIX':'WING - NIX','TANK WING - OPEN':'TANK WING - OPEN','OTHER':'OTHER'};\n  function formationName(r){const raw=String(r?.pff_OFFENSIVE_FORMATION_NAME||r?.pff_STARTING_OFFENSIVE_FORMATION_NAME||r?.pff_OFFFORMATIONGROUP||'').trim();return W4_FORM_MAP[raw.toUpperCase()]||raw}"
          if old not in s: raise SystemExit('formation function not found')
          s=s.replace(old,new)
          Path('week4-run-exact-v3.js').write_text(s)
          p=Path('index.html')
          html=p.read_text()
          for tag in ['<script src="week4-fau-clean-v1.js?v=20260920clean3"></script>','<script src="week4-run-exact-v3.js?v=20260920clean3"></script>','<script src="week4-photo-exact-v2.js?v=20260920clean3"></script>']:
              html=html.replace(tag+'\n','').replace(tag,'')
          html=html.replace('<script src="week4-fau-clean-v1.js?v=20260920clean1"></script>','')
          tags='\n<script src="week4-fau-clean-v1.js?v=20260920clean3"></script>\n<script src="week4-run-exact-v3.js?v=20260920clean3"></script>\n<script src="week4-photo-exact-v2.js?v=20260920clean3"></script>\n'
          html=html.replace('</body>',tags+'</body>')
          p.write_text(html)
          PY
      - name: Syntax check
        run: |
          node --check week4-fau-clean-v1.js
          node --check week4-run-exact-v3.js
          node --check week4-photo-exact-v2.js
          node --check api/fau-player-image.js
      - name: Commit
        run: |
          git config user.name "tommydenison4-ctrl"
          git config user.email "tommydenison4@gmail.com"
          git add week4-run-exact-v3.js index.html
          git diff --cached --quiet || git commit -m "Build FAU Week 4 from exact prior-week template"
          git push origin HEAD:week4-rebuild-clean
