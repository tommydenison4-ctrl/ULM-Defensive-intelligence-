name: Build Week 4 Exact Parity v3
on:
  push:
    branches: [week4-rebuild-clean]
    paths:
      - '.github/workflows/build-week4-exact-parity-v3.yml'
      - 'week4-photo-exact-v2.js'
      - 'api/fau-player-image.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: week4-rebuild-clean
      - name: Generate exact Week 4 run renderer from proven Week 3 renderer
        shell: python
        run: |
          from pathlib import Path
          src=Path('week3-run-chart-v3.js').read_text()
          src=src.replace('Week 3 Southeastern run-chart correction','Week 4 Florida Atlantic exact Week 3 run-chart parity')
          src=src.replace('const isW3=', 'const isW4=')
          src=src.replace("prepWeek==='W3'", "prepWeek==='W4'")
          src=src.replace('selectedW3Runs','selectedW4Runs')
          src=src.replace('if(!isW3())','if(!isW4())')
          old="function formationName(r){return String(r?.pff_OFFENSIVE_FORMATION_NAME||r?.pff_STARTING_OFFENSIVE_FORMATION_NAME||r?.pff_OFFFORMATIONGROUP||'').trim()}"
          mapping="""const W4_FORM_MAP={'TREY - OPEN':'TREY Y OFF','SLOT - PRO':'DUO Y OFF','TRIPS - CLOSED':'TRIPS','TREY - CLOSED':'KING U OFF','TRIPS - OPEN':'TRIPS - OPEN','PRO - PRO':'ACE YU OFF','SLOT - SLOT':'DOUBLES','TRIPS - SLOT':'TRIPS - SLOT','SLOT - WING':'SLOT - WING','TOAD WING - OPEN':'TREY U HIP','PRO - OPEN':'PRO - OPEN','SLOT - CLOSED':'PRO','SLOT - OPEN':'SLOT - OPEN','QUAY - NIX':'TREY Y OFF','TREY - NIX':'TREY Y OFF','QUAY - OPEN':'TREY Y OFF','PRO - WING':'PRO - WING','QUADS WING - NIX':'QUADS WING - NIX','TREY - SLOT':'EMPTY 3x2 Y OFF','TREY - PRO':'ACE YU OFF','PRO - CLOSED':'KING U OFF B HIP','QUADS - OPEN':'EMPTY 4x1 Y OFF','TOAD WING - SLOT':'EMPTY 4x1 T STING','TOAD WING - PRO':'TOAD WING - PRO','TOAD WING - CLOSED':'TOAD WING - CLOSED','TRIPS - WING':'TRIPS - WING','TRIPS - PRO':'TRIPS - PRO','CLOSED - CLOSED':'CLOSED - CLOSED','OPEN - OPEN':'OPEN - OPEN','OPEN - CLOSED':'OPEN - CLOSED','WING - CLOSED':'WING - CLOSED','WING - OPEN':'WING - OPEN','WING - NIX':'WING - NIX','TANK WING - OPEN':'TANK WING - OPEN','OTHER':'OTHER'};
  function formationName(r){const raw=String(r?.pff_OFFENSIVE_FORMATION_NAME||r?.pff_STARTING_OFFENSIVE_FORMATION_NAME||r?.pff_OFFFORMATIONGROUP||'').trim();return W4_FORM_MAP[raw.toUpperCase()]||raw}"""
          if old not in src:
              raise SystemExit('formationName signature not found')
          src=src.replace(old,mapping)
          Path('week4-run-exact-v3.js').write_text(src)
      - name: Load only clean Week 4 adapter plus exact run/photo layers
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # On the clean branch there must be no legacy Week 4 repair stack.
          s=re.sub(r'\s*<script src=["\']week4-(?!fau-clean-v1\.js)[^"\']+\.js[^>]*></script>\s*','\n',s)
          # Ensure clean adapter is present once.
          clean='<script src="week4-fau-clean-v1.js?v=20260920clean3"></script>'
          s=re.sub(r'\s*<script src=["\']week4-fau-clean-v1\.js[^>]*></script>\s*','\n',s)
          tags=clean+'\n<script src="week4-run-exact-v3.js?v=20260920clean3"></script>\n<script src="week4-photo-exact-v2.js?v=20260920clean3"></script>'
          s=s.replace('</body>',tags+'\n</body>')
          p.write_text(s)
      - name: Syntax checks
        run: |
          node --check week4-fau-clean-v1.js
          node --check week4-run-exact-v3.js
          node --check week4-photo-exact-v2.js
          node --check api/fau-player-image.js
      - name: Assert no legacy Week 4 scripts remain
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          tags=re.findall(r'<script src="(week4-[^"]+)',s)
          allowed={'week4-fau-clean-v1.js?v=20260920clean3','week4-run-exact-v3.js?v=20260920clean3','week4-photo-exact-v2.js?v=20260920clean3'}
          bad=[x for x in tags if x not in allowed]
          if bad: raise SystemExit('legacy Week 4 scripts remain: '+str(bad))
      - name: Commit clean exact parity build
        run: |
          git config user.name "tommydenison4-ctrl"
          git config user.email "tommydenison4@gmail.com"
          git add week4-run-exact-v3.js index.html
          git diff --cached --quiet || git commit -m "Build FAU Week 4 from exact prior-week template"
          git push origin HEAD:week4-rebuild-clean
