name: Apply Week 4 FAU v5
on:
  push:
    paths:
      - 'week4-fau-data-language-photo-v5.js'
      - 'api/fau-player-image.js'
      - '.github/workflows/apply-week4-fau-v5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Week 4 v5 last
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          name='week4-fau-data-language-photo-v5.js'
          s=re.sub(r'\s*<script src=["\']'+re.escape(name)+r'[^>]*></script>\s*','\n',s)
          tag='<script src="week4-fau-data-language-photo-v5.js?v=20260920w4v5"></script>'
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
      - name: Commit index update
        run: |
          git config user.name "tommydenison4-ctrl"
          git config user.email "tommydenison4@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load Week 4 FAU v5 repair last"
          git push
