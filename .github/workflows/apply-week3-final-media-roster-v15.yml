name: Apply Week 3 Final Media Roster v15
on:
  push:
    paths:
      - 'week3-final-media-roster-v15.js'
      - '.github/workflows/apply-week3-final-media-roster-v15.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert v15 last
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="week3-final-media-roster-v15.js?v=20260918v15"></script>'
          import re
          s=re.sub(r'\s*<script src="week3-final-media-roster-v15\.js[^>]*></script>\s*','\n',s)
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
      - name: Commit index update
        run: |
          git config user.name "tommydenison4-ctrl"
          git config user.email "tommydenison4@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load Week 3 v15 roster/photo layer last"
          git push
