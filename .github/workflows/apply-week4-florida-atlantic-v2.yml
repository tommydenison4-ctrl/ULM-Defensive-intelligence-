name: Apply Week 4 Florida Atlantic v2
on:
  push:
    paths:
      - 'week4-florida-atlantic-v2-fix.js'
      - 'api/fau-depth-pdf.js'
      - '.github/workflows/apply-week4-florida-atlantic-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Week 4 v2 repair last
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="week4-florida-atlantic-v2-fix.js?v=20260920w4v2"></script>'
          s=re.sub(r'\s*<script src="week4-florida-atlantic-v2-fix\.js[^>]*></script>\s*','\n',s)
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
      - name: Commit index update
        run: |
          git config user.name "tommydenison4-ctrl"
          git config user.email "tommydenison4@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load Week 4 FAU v2 roster/depth repair"
          git push
