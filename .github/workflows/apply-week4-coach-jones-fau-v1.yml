name: Apply Week 4 Coach Jones FAU v1
on:
  push:
    branches: [main]
    paths:
      - 'week4-coach-jones-fau-v1.js'
      - '.github/workflows/apply-week4-coach-jones-fau-v1.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Week 4 Coach Jones script last
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./week4-coach-jones-fau-v1.js?v=20260925a"></script>'
          s=re.sub(r'\n?<script src="\./week4-coach-jones-fau-v1\.js[^\n]*</script>','',s)
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load Florida Atlantic Coach Jones Week 4 tips"
          git push
