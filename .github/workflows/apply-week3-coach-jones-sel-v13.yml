name: Apply Week 3 Coach Jones SEL v13
on:
  push:
    paths:
      - 'week3-coach-jones-sel-v13.js'
      - '.github/workflows/apply-week3-coach-jones-sel-v13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert v13 script last
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./week3-coach-jones-sel-v13.js?v=20260918b"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load SEL Coach Jones v13"
          git push
