name: Apply Week 3 player intelligence v5

on:
  push:
    branches:
      - main
    paths:
      - week3-player-intel-v5.js
      - api/sle-roster.js
      - api/sle-player-image.js
      - .github/workflows/apply-week3-player-intel-v5.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert or refresh Week 3 player intelligence script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./week3-player-intel-v5.js?v=20260912b"></script>'
          pat=r'<script src="\.\/week3-player-intel-v5\.js\?v=[^"]+"></script>'
          if re.search(pat,s):
              s=re.sub(pat,tag,s)
          elif tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Week 3 player intelligence v5"
          git push
