name: Apply Week 3 fixes

on:
  push:
    branches:
      - main
    paths:
      - week3-southeastern-fixes.js
      - .github/workflows/apply-week3-fixes.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Week 3 fixes script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./week3-southeastern-fixes.js?v=20260912b"></script>'
          if tag not in s:
              anchor='<script src="./week3-southeastern.js?v=20260912"></script>'
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n'+tag)
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>')
              else:
                  raise SystemExit('index.html has no insertion point')
              p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "index already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Week 3 Southeastern fixes"
          git push
