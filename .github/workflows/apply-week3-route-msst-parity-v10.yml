name: Apply Week 3 route MSST parity v10

on:
  push:
    branches: [main]
    paths:
      - week3-route-msst-parity-v10.js
      - .github/workflows/apply-week3-route-msst-parity-v10.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load v10 last before body close
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./week3-route-msst-parity-v10.js?v=20260912g"></script>'
          s=re.sub(r'\n?<script src="\.\/week3-route-msst-parity-v10\.js\?v=[^"]+"></script>','',s)
          if '</body>' not in s:
              raise SystemExit('No body close found')
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Week 3 Mississippi State route parity v10 last"
          git push
